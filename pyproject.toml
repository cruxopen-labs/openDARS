[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opendars"
version = "0.1.0"
description = "Calibrated analytical design-space exploration for openTARS"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Crux Open Labs" }]
keywords = ["design-space-exploration", "fpga", "asic", "llm", "opentars"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dars = "dars.cli:main"

[project.urls]
Homepage = "https://github.com/cruxopen-labs/openDARS"
Repository = "https://github.com/cruxopen-labs/openDARS"
Issues = "https://github.com/cruxopen-labs/openDARS/issues"

[tool.setuptools.packages.find]
include = ["dars*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
