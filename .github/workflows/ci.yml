name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          dars report --no-search --out "$RUNNER_TEMP/reports"
          test -s "$RUNNER_TEMP/reports/report.md"
          test -s "$RUNNER_TEMP/reports/validation.json"

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          dars --help
          python -c 'from importlib.metadata import metadata; m = metadata("opendars"); assert m["License-Expression"] == "Apache-2.0", m["License-Expression"]; assert "LICENSE" in (m["License-File"] or ""), m["License-File"]'
